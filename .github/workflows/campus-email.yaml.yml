name: scheduleRenderbook
on:     
  push: 
  schedule:     
     - cron: "45 11 * * *"  # Runs at 11:45 UTC daily
     
jobs:
  bookdown:
    name: Render-Report-Send-Email
    runs-on: ubuntu-latest # Changed from macos - MUCH cheaper and faster
    steps: 
      - uses: actions/checkout@v4 # Updated to v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0' # Specify version for consistency
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      
      # OPTIMIZATION: Install all packages in one step
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "glue", "kableExtra", "dplyr", "viridis", "lubridate", "googlesheets4"), repos="https://cloud.r-project.org")'
      
      # OPTIMIZATION: Cache R packages to speed up builds
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-
      
      - name: Render Book
        env:
          GDRIVE_PAT: ${{ secrets.GDRIVE_PAT }}
        run: Rscript -e 'rmarkdown::render("index.Rmd")'
      
      # Optional: Keep artifact for debugging
      - uses: actions/upload-artifact@v4 # Updated to v4
        if: always() # Upload even if render fails
        with:
          name: index-html
          path: index.html
          retention-days: 7 # Auto-cleanup after 7 days
      
      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: Campus guests and booking update - ${{ github.run_number }}
          to: eleanorflatt@osaconservation.org,andydiaz@osaconservation.org,reservations@osaconservation.org,danielalvarez@osaconservation.org,iselacambronero@osaconservation.org,marielaprendas@osaconservation.org,gilverfernandez@osaconservation.org,operations@osaconservation.org
          from: Campus Update Bot <${{secrets.MAIL_USERNAME}}>
          html_body: file://index.html
          ignore_cert: true
          convert_markdown: false # HTML already rendered
          priority: normal
