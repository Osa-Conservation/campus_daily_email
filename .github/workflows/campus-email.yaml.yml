name: scheduleRenderbook
on:     
  push: 
  schedule:     
     - cron: "45 11 * * *"  # Runs at 11:45 UTC daily
     
jobs:
  bookdown:
    name: Render-Report-Send-Email
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true  # Use pre-compiled binaries - MUCH faster!
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      
      # Install system dependencies for R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev
      
      # Cache R packages BEFORE installing
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.3.0-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-4.3.0-
            ${{ runner.os }}-r-
      
      # Install all R packages
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "glue", "kableExtra", "dplyr", "viridis", "lubridate", "googlesheets4"))'
      
      - name: Render Book
        env:
          GDRIVE_PAT: ${{ secrets.GDRIVE_PAT }}
        run: Rscript -e 'rmarkdown::render("index.Rmd")'
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-html
          path: index.html
          retention-days: 7
      
      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: Campus guests and booking update - ${{ github.run_number }}
          to: eleanorflatt@osaconservation.org,andydiaz@osaconservation.org,reservations@osaconservation.org,danielalvarez@osaconservation.org,iselacambronero@osaconservation.org,marielaprendas@osaconservation.org,gilverfernandez@osaconservation.org,operations@osaconservation.org
          from: Campus Update Bot <${{secrets.MAIL_USERNAME}}>
          html_body: file://index.html
          ignore_cert: true
          convert_markdown: false
          priority: normal